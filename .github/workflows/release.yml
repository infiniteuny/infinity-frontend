# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
      release_type:
        description: "Release type"
        required: true
        type: choice
        default: "prod"
        options:
          - alpha
          - beta
          - rc
          - prod
      pre_release_version:
        description: "Pre-release version (for non production releases)"
        required: false
        type: number

jobs:
  guard:
    name: Validate branch and release type
    runs-on: ubuntu-latest
    steps:
      - name: Check if branch and release type match
        id: guard
        run: |
          if [[ "$BRANCH" != "main" && "$BRANCH" != "develop" ]]; then
            echo "Branch is not main or develop! Aborting."
            VERSION_MISMATCH='true';
          elif [ "$BRANCH" == "main" ] && [ "$RELEASE_TYPE" != "prod" ]; then
            echo "Branch and release type do not match! Aborting."
            VERSION_MISMATCH='true';
          elif [ "$BRANCH" == "develop" ] && ( [ "$RELEASE_TYPE" == "prod" ] || [ -z "$PRE_RELEASE_VERSION" ] ); then
            echo "Branch and release type do not match! Aborting."
            VERSION_MISMATCH='true';
          else
            echo "Branch and release type match! Proceeding."
            VERSION_MISMATCH='false';
          fi

          echo "version_mismatch=$(echo $VERSION_MISMATCH)" >> "$GITHUB_OUTPUT";
        env:
          BRANCH: ${{ github.ref_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          PRE_RELEASE_VERSION: ${{ inputs.pre_release_version }}

      - name: Fail if branch and release type do not match
        if: ${{ steps.guard.outputs.version_mismatch == 'true' }}
        uses: actions/github-script@v9.0.0
        with:
          script: |
            core.setFailed('Workflow failed. Did you set the correct version, release type, and pre-release version?');

  prepare:
    name: Prepare release
    needs:
      - guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      annotations: ${{ steps.meta.outputs.annotations }}
      clean_changelog: ${{ steps.changelog.outputs.clean_changelog }}
      commit_hash: ${{ steps.auto-commit.outputs.commit_hash }}
    steps:
      - name: Set version
        id: version
        run: |
          if [ "$RELEASE_TYPE" != "prod" ]; then
            VERSION="${VERSION#v}-${RELEASE_TYPE}.${PRE_RELEASE_VERSION}"
          else
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          PRE_RELEASE_VERSION: ${{ inputs.pre_release_version }}

      - name: Checkout repo
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Update app version
        run: 'sed -i "s/\"version\": \".*\",/\"version\": \"${{ steps.version.outputs.version }}\",/g" package.json'

      - name: Generate changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-commit: "true"
          skip-tag: "true"
          skip-git-pull: "true"
          skip-version-file: "true"
          output-file: "CHANGELOG.md"
          tag-prefix: "v"

      - name: Commit and push version change
        if: ${{ inputs.release_type == 'prod' }}
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v7.1.0
        with:
          commit_message: "chore: Update version to v${{ steps.version.outputs.version }}"

      - name: Upload modified files
        if: ${{ inputs.release_type != 'prod' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-files
          path: |
            package.json
            CHANGELOG.md
          retention-days: 1

      - name: Extract metadata for Container
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Infinity Front-End
            org.opencontainers.image.description=Infinity front-end app image, see https://github.com/infiniteuny/infinity-frontend/ for more info.
            org.opencontainers.image.vendor=INFINITE UNY
          annotations: |
            org.opencontainers.image.title=Infinity Front-End
            org.opencontainers.image.description=Infinity front-end app image, see https://github.com/infiniteuny/infinity-frontend/ for more info.
            org.opencontainers.image.vendor=INFINITE UNY
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

  build:
    name: Build (${{ matrix.platform }})
    needs:
      - prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            scope: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            scope: arm64
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.commit_hash || github.ref_name }}

      - name: Download release files
        if: ${{ inputs.release_type != 'prod' }}
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-files
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          labels: ${{ needs.prepare.outputs.labels }}
          annotations: ${{ needs.prepare.outputs.annotations }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: type=gha,scope=${{ matrix.scope }},mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_INFINITY_API_URL=${{ secrets.NEXT_PUBLIC_INFINITY_API_URL }}
            NEXT_PUBLIC_INFINITY_API_TIMEOUT=${{ secrets.NEXT_PUBLIC_INFINITY_API_TIMEOUT }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: digests-${{ matrix.scope }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create multi-arch manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Prepare sources
        id: sources
        working-directory: /tmp/digests
        run: |
          {
            echo 'sources<<EOF'
            for f in *; do
              echo "ghcr.io/${{ github.repository }}@sha256:${f}"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: manifest
        uses: int128/docker-manifest-create-action@v2.24.0
        with:
          tags: ${{ needs.prepare.outputs.tags }}
          index-annotations: ${{ needs.prepare.outputs.labels }}
          sources: ${{ steps.sources.outputs.sources }}

  sign:
    name: Sign images
    needs:
      - prepare
      - merge
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the images with GitHub OIDC token
        run: |
          for tag in ${TAGS//,/ }; do
            cosign sign --yes "${tag}@${DIGEST}"
          done
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
          TAGS: ${{ needs.prepare.outputs.tags }}

  release:
    name: Create GitHub release
    needs:
      - guard
      - prepare
      - sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.prepare.outputs.commit_hash || github.ref_name }}

      - name: Create release
        uses: softprops/action-gh-release@v3.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          prerelease: ${{ inputs.release_type != 'prod' }}
          make_latest: "${{ inputs.release_type == 'prod' }}"
          body: ${{ needs.prepare.outputs.clean_changelog }}
