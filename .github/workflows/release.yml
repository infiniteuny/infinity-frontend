# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
      release_type:
        description: "Release type"
        required: true
        type: choice
        default: "prod"
        options:
          - alpha
          - beta
          - rc
          - prod
      pre_release_version:
        description: "Pre-release version (for non production releases)"
        required: false
        type: number

jobs:
  guard:
    name: Validate branch and release type
    runs-on: ubuntu-latest
    steps:
      - name: Check if branch and release type match
        id: guard
        run: |
          if [[ "$RELEASE_TYPE" == "prod" && ( "$REF_TYPE" != "branch" || "$REF_NAME" != "main" ) ]]; then
            echo "Production releases must only be triggered from the main branch! Aborting."
            VERSION_MISMATCH='true';
          elif [[ "$RELEASE_TYPE" != "prod" && "$REF_TYPE" != "branch" ]]; then
            echo "Non-production releases must be triggered from a branch! Aborting."
            VERSION_MISMATCH='true';
          elif [[ "$RELEASE_TYPE" != "prod" && -z "$PRE_RELEASE_VERSION" ]]; then
            echo "A pre-release version is required for non-production releases! Aborting."
            VERSION_MISMATCH='true';
          else
            echo "Branch and release type match! Proceeding."
            VERSION_MISMATCH='false';
          fi

          echo "version_mismatch=$(echo $VERSION_MISMATCH)" >> "$GITHUB_OUTPUT";
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          PRE_RELEASE_VERSION: ${{ inputs.pre_release_version }}

      - name: Fail if branch and release type do not match
        if: ${{ steps.guard.outputs.version_mismatch == 'true' }}
        uses: actions/github-script@v9.0.0
        with:
          script: |
            core.setFailed('Workflow failed. Did you set the correct version, release type, and pre-release version?');

  prepare:
    name: Prepare release
    needs:
      - guard
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      clean_changelog: ${{ steps.changelog.outputs.clean_changelog }}
      commit_hash: ${{ steps.auto-commit.outputs.commit_hash }}
    steps:
      - name: Set version
        id: version
        run: |
          if [ "$RELEASE_TYPE" != "prod" ]; then
            VERSION="${VERSION#v}-${RELEASE_TYPE}.${PRE_RELEASE_VERSION}"
          else
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          PRE_RELEASE_VERSION: ${{ inputs.pre_release_version }}

      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Update workspace version
        run: 'sed -i "s/\"version\": \".*\",/\"version\": \"${{ steps.version.outputs.version }}\",/g" package.json apps/*/package.json packages/*/package.json'

      - name: Generate changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          skip-commit: "true"
          skip-tag: "true"
          skip-git-pull: "true"
          skip-version-file: "true"
          output-file: "CHANGELOG.md"
          tag-prefix: "v"

      - name: Commit and push version change
        if: ${{ inputs.release_type == 'prod' }}
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@v7.2.1
        with:
          commit_message: "chore: Update version to v${{ steps.version.outputs.version }}"

      - name: Upload modified files
        if: ${{ inputs.release_type != 'prod' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-files
          path: |
            package.json
            apps/*/package.json
            packages/*/package.json
            CHANGELOG.md
          retention-days: 1

  build:
    name: Build ${{ matrix.app }} (${{ matrix.platform }})
    needs:
      - prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - dashboard
          - landing
        arch:
          - amd64
          - arm64
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - app: dashboard
            title: Infinity Dashboard
            description: Infinity dashboard app image, see https://github.com/infiniteuny/infinity-frontend/ for more info.
          - app: landing
            title: Infinity Landing
            description: Infinity landing app image, see https://github.com/infiniteuny/infinity-frontend/ for more info.
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_hash || github.ref_name }}

      - name: Download release files
        if: ${{ inputs.release_type != 'prod' }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: release-files
          path: .

      - name: Extract metadata for Container
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/infinity-${{ matrix.app }}
          tags: type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=INFINITE UNY
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=INFINITE UNY
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/infinity-${{ matrix.app }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }},mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ matrix.app == 'landing' && secrets.NEXT_PUBLIC_LANDING_APP_URL || secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_INFINITY_API_URL=${{ secrets.NEXT_PUBLIC_INFINITY_API_URL }}
            NEXT_PUBLIC_INFINITY_API_TIMEOUT=${{ secrets.NEXT_PUBLIC_INFINITY_API_TIMEOUT }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: digests-${{ matrix.app }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Create multi-arch manifest (${{ matrix.app }})
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - dashboard
          - landing
        include:
          - app: dashboard
            title: Infinity Dashboard
            description: Infinity dashboard app image, see https://github.com/infiniteuny/infinity-frontend/ for more info.
          - app: landing
            title: Infinity Landing
            description: Infinity landing app image, see https://github.com/infiniteuny/infinity-frontend/ for more info.
    steps:
      - name: Extract metadata for Container
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/infinity-${{ matrix.app }}
          tags: type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=INFINITE UNY
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.vendor=INFINITE UNY
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Download digests
        uses: actions/download-artifact@v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.app }}-*
          merge-multiple: true

      - name: Prepare sources
        id: sources
        working-directory: /tmp/digests
        run: |
          {
            echo 'sources<<EOF'
            for f in *; do
              echo "ghcr.io/${{ github.repository_owner }}/infinity-${{ matrix.app }}@sha256:${f}"
            done
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        id: manifest
        uses: int128/docker-manifest-create-action@v2.30.0
        with:
          tags: ${{ steps.meta.outputs.tags }}
          index-annotations: ${{ steps.meta.outputs.labels }}
          sources: ${{ steps.sources.outputs.sources }}

      - name: Export manifest digest
        run: |
          mkdir -p /tmp/manifest
          echo "${{ steps.manifest.outputs.digest }}" > /tmp/manifest/digest.txt

      - name: Upload manifest digest artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: manifest-digest-${{ matrix.app }}
          path: /tmp/manifest/digest.txt
          if-no-files-found: error
          retention-days: 1

  sign:
    name: Sign image (${{ matrix.app }})
    needs:
      - prepare
      - merge
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app:
          - dashboard
          - landing
    steps:
      - name: Extract metadata for Container
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/infinity-${{ matrix.app }}
          tags: type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}

      - name: Download manifest digest
        uses: actions/download-artifact@v8.0.2
        with:
          name: manifest-digest-${{ matrix.app }}
          path: /tmp/manifest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign the images with GitHub OIDC token
        run: |
          DIGEST=$(cat /tmp/manifest/digest.txt)
          for tag in ${TAGS//,/ }; do
            cosign sign --yes "${tag}@${DIGEST}"
          done
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

  release:
    name: Create GitHub release
    needs:
      - guard
      - prepare
      - sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit_hash || github.ref_name }}

      - name: Create release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          prerelease: ${{ inputs.release_type != 'prod' }}
          make_latest: "${{ inputs.release_type == 'prod' }}"
          body: ${{ needs.prepare.outputs.clean_changelog }}
